name: Build and deploy MySinginMonsters

on:
  push:
    branches:
      - main
    paths:
      - 'MySingingMonsters/**'

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Game
        run: |
          dotnet publish MySingingMonsters/MySingingMonsters.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -o build/MySingingMonsters
        shell: pwsh
      - name: Install Butler
        shell: pwsh
        run: |
            Invoke-WebRequest -Uri https://broth.itch.zone/butler/windows-amd64/LATEST/archive/default -OutFile butler.zip
            Expand-Archive -Path butler.zip -DestinationPath butler-bin
      - name: Deploy to itch.io
        env:
          BUTLER_API_KEY: TTXh5JD8WKeUaCZACMbOlx4eiqApK8co3xVtsSnO
        run: |
          ./butler-bin/butler push `
            build/MySingingMonsters `
            Geckodude07/my-singing-monsters-battle-sim:windows